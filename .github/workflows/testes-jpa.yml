name: Testes API Spring Data JPA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: dio-spring-jpa/pom.xml
      - run: mvn -B -ntp -f dio-spring-jpa/pom.xml test
